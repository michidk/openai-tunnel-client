name: CI

on:
  push:
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and verify metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile Python
        run: python3 -m compileall -q scripts/fetch-release.py

      - name: Run ShellCheck
        run: shellcheck -x scripts/verify-release-metadata scripts/update-version scripts/setup-kubeconform

      - name: Verify pinned upstream checksums
        run: scripts/verify-release-metadata

      - name: Lint and render Helm chart
        run: |
          helm lint charts/openai-tunnel-client \
            --values charts/openai-tunnel-client/ci/test-values.yaml
          scripts/setup-kubeconform
          helm template test charts/openai-tunnel-client \
            --values charts/openai-tunnel-client/ci/test-values.yaml | \
            .tools/bin/kubeconform -strict -summary -kubernetes-version 1.33.0

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  build:
    name: Build and smoke-test ${{ matrix.target }} on ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, python312, python313]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Read upstream version
        id: version
        run: |
          source versions.env
          {
            echo "version=${TUNNEL_CLIENT_VERSION}"
            echo "sha256_amd64=${TUNNEL_CLIENT_SHA256_AMD64}"
            echo "sha256_arm64=${TUNNEL_CLIENT_SHA256_ARM64}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          target: ${{ matrix.target }}
          tags: local/tunnel-client:${{ matrix.target }}-${{ matrix.arch }}
          build-args: |
            TUNNEL_CLIENT_VERSION=${{ steps.version.outputs.version }}
            TUNNEL_CLIENT_SHA256_AMD64=${{ steps.version.outputs.sha256_amd64 }}
            TUNNEL_CLIENT_SHA256_ARM64=${{ steps.version.outputs.sha256_arm64 }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Smoke-test tunnel-client
        run: docker run --rm local/tunnel-client:${{ matrix.target }}-${{ matrix.arch }} --version

      - name: Verify runtime identity
        run: test "$(docker image inspect local/tunnel-client:${{ matrix.target }}-${{ matrix.arch }} --format '{{.Config.User}}')" = "65532:65532"

      - name: Smoke-test Python toolchain
        if: matrix.target != 'runtime'
        run: docker run --rm --entrypoint /bin/sh local/tunnel-client:${{ matrix.target }}-${{ matrix.arch }} -c 'python3 --version && uv --version'

      - name: Verify pip is absent from Python 3.13
        if: matrix.target == 'python313'
        run: docker run --rm --entrypoint /bin/sh local/tunnel-client:${{ matrix.target }}-${{ matrix.arch }} -c '! python3 -m pip --version'

      - name: Report complete image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/tunnel-client:${{ matrix.target }}-${{ matrix.arch }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Gate wrapper image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/tunnel-client:${{ matrix.target }}-${{ matrix.arch }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-dirs: /usr/share/licenses/tunnel-client
          skip-files: /usr/local/bin/tunnel-client,/usr/local/bin/cloudflared
