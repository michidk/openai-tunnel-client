name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256_amd64: ${{ steps.version.outputs.sha256_amd64 }}
      sha256_arm64: ${{ steps.version.outputs.sha256_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate tag and checksums
        id: version
        run: |
          source versions.env
          test "${GITHUB_REF_NAME}" = "v${TUNNEL_CLIENT_VERSION}"
          scripts/verify-release-metadata
          {
            echo "version=${TUNNEL_CLIENT_VERSION}"
            echo "sha256_amd64=${TUNNEL_CLIENT_SHA256_AMD64}"
            echo "sha256_arm64=${TUNNEL_CLIENT_SHA256_ARM64}"
          } >>"${GITHUB_OUTPUT}"

  image:
    name: Publish ${{ matrix.flavor }} image
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: runtime
            target: runtime
            suffix: ""
            floating: latest
          - flavor: python3.12
            target: python312
            suffix: -python3.12
            floating: python3.12
          - flavor: python3.13
            target: python313
            suffix: -python3.13
            floating: python3.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openai-tunnel-client
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}${{ matrix.suffix }}
            type=raw,value=${{ matrix.floating }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TUNNEL_CLIENT_VERSION=${{ needs.check.outputs.version }}
            TUNNEL_CLIENT_SHA256_AMD64=${{ needs.check.outputs.sha256_amd64 }}
            TUNNEL_CLIENT_SHA256_ARM64=${{ needs.check.outputs.sha256_arm64 }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true

  pin-chart:
    name: Pin chart image digest
    needs: [check, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Pin published runtime manifest
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          source versions.env
          if [[ "${TUNNEL_CLIENT_VERSION}" != "${VERSION}" ]]; then
            echo "main has advanced to v${TUNNEL_CLIENT_VERSION}; not changing its chart digest"
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/openai-tunnel-client:${VERSION}"
          digest=$(docker buildx imagetools inspect "${image}" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "could not resolve the manifest digest for ${image}" >&2
            exit 1
          fi
          sed -i -E "s/^(  digest: ).*/\1\"${digest}\"/" charts/openai-tunnel-client/values.yaml
          if git diff --quiet -- charts/openai-tunnel-client/values.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- charts/openai-tunnel-client/values.yaml
          git commit -m "chore(chart): pin tunnel-client v${VERSION} digest"
          git push origin HEAD:main

  release:
    name: Create GitHub release
    needs: [check, image, pin-chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
