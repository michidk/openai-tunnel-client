name: Update upstream tunnel-client

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-upstream-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update version and checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Update from the latest official release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/update-version
          source versions.env
          echo "version=${TUNNEL_CLIENT_VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Verify updated metadata
        run: scripts/verify-release-metadata

      - name: Commit update directly to main
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          if git diff --quiet -- versions.env charts/openai-tunnel-client/Chart.yaml charts/openai-tunnel-client/values.yaml; then
            echo "Already packaging tunnel-client v${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- versions.env charts/openai-tunnel-client/Chart.yaml charts/openai-tunnel-client/values.yaml
          git commit -m "chore(deps): update tunnel-client to v${VERSION}"
          git push origin HEAD:main
