replicaCount: 1

image:
  repository: ghcr.io/michidk/openai-tunnel-client
  tag: "0.0.12"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

tunnel:
  profileName: ""
  existingConfigMap: ""
  profileKey: ""
  profileMountPath: /etc/tunnel-client
  apiKeySecret:
    name: ""
    key: CONTROL_PLANE_API_KEY
  extraArgs: []

extraEnv: []
extraEnvFrom: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

health:
  address: 0.0.0.0:8080
  port: 8080

startupProbe:
  httpGet:
    path: /healthz
    port: health
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  failureThreshold: 3
  periodSeconds: 15
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  failureThreshold: 3
  periodSeconds: 30
  timeoutSeconds: 3

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

tmp:
  sizeLimit: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraVolumes: []
extraVolumeMounts: []

terminationGracePeriodSeconds: 30
